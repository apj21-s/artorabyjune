<!DOCTYPE html>
<html lang="en">
<head>
{{> head}}
<link rel="stylesheet" href="/css/admin.css">
</head>
<body data-page="admin" class="is-admin">
<a class="skip-link" href="#main">Skip to content</a>
<div class="admin-shell">
  <header class="admin-topbar"><a href="/" class="logo"><span class="dot"></span>Artora <span class="accent">studio</span></a><span class="admin-topbar-title" data-current-section>Overview</span></header>
  <aside class="admin-nav" aria-label="Admin" id="adminMenu">
    <p class="admin-nav-sheet-title">All sections</p>
    <a href="/" class="logo"><span class="dot"></span>Artora <span class="accent">studio</span></a>
    <nav>
      <a href="#overview" data-nav="overview">Overview</a>
      <a href="#orders" data-nav="orders">Orders <span class="badge" data-badge="orders" hidden></span></a>
      <a href="#payments" data-nav="payments">Payments <span class="badge" data-badge="payments" hidden></span></a>
      <a href="#products" data-nav="products">Products</a>
      <a href="#coupons" data-nav="coupons">Coupons</a>
      <a href="#giftcards" data-nav="giftcards">Gift cards</a>
      <a href="#reviews" data-nav="reviews">Reviews <span class="badge" data-badge="reviews" hidden></span></a>
      <a href="#content" data-nav="content">Site content</a>
      <a href="#messages" data-nav="messages">Messages <span class="badge" data-badge="messages" hidden></span></a>
      <a href="#subscribers" data-nav="subscribers">Subscribers</a>
      <a href="#admins" data-nav="admins">Admin access</a>
    </nav>
    <div class="admin-nav-foot"><a href="/">View site ↗</a><button class="link-btn" type="button" data-logout>Sign out</button></div>
  </aside>
  <div class="admin-sheet-backdrop" data-menu-close hidden></div>
  <nav class="admin-tabbar" aria-label="Quick links">
    <a href="#overview" data-nav="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z M10 20v-6h4v6"/></svg><span>Overview</span></a>
    <a href="#orders" data-nav="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z M9 7a3 3 0 0 1 6 0"/></svg><span>Orders</span><span class="badge" data-badge="orders" hidden></span></a>
    <a href="#payments" data-nav="payments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v10H3z M3 11h18 M7 15h4"/></svg><span>Payments</span><span class="badge" data-badge="payments" hidden></span></a>
    <a href="#messages" data-nav="messages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v11H8l-4 3z"/></svg><span>Messages</span><span class="badge" data-badge="messages" hidden></span></a>
    <button type="button" data-menu-toggle aria-expanded="false" aria-controls="adminMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M4 12h16 M4 17h16"/></svg><span>More</span></button>
  </nav>
  <main id="main" class="admin-main" data-admin-main aria-live="polite">
    <div class="skeleton-block"></div>
  </main>
</div>
<div class="modal-backdrop" data-modal hidden><div class="modal paper" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="modal-head"><h2 id="modalTitle" data-modal-title></h2><button class="icon-btn" type="button" data-modal-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body" data-modal-body></div></div></div>
<div class="toast-stack" data-toasts aria-live="polite"></div>
<script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
