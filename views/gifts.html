<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
{{> head}}
</head>
<body data-page="gifts" class="{{bodyClass}}">
{{> header}}
<main id="main">
<div class="wrap">
  <section class="page-hero"><h1>A gift nobody else could have bought.</h1><p class="sub">Pick the occasion, check the dates, and let June do the rest. Every gift can ship with a handwritten note and no price tag.</p></section>
  <section class="planner" aria-labelledby="planner-title">
    <div><h2 id="planner-title">Will it arrive in time?</h2><p>Pick the day you’ll give it. We’ll tell you what to order, and by when.</p></div>
    <form class="planner-form" data-planner>
      <div class="field"><label for="giftDate">Gifting day</label><input id="giftDate" type="date" required></div>
      <div class="planner-result" data-planner-result aria-live="polite"></div>
    </form>
  </section>
  <div class="occasion-sections" data-occasion-sections></div>
</div>
</main>
{{> footer}}
<script type="module" src="/js/pages/gifts.js"></script>
</body>
</html>
