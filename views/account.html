<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
{{> head}}
</head>
<body data-page="account" class="{{bodyClass}}">
{{> header}}
<main id="main">
<div class="wrap">
  <section class="page-hero page-hero-tight account-hero">
    <div><h1 data-greeting>Hello.</h1></div>
    <div class="account-hero-actions"><a class="btn btn-ghost" href="/admin" data-admin-link hidden>Open admin</a><button class="btn btn-ghost" type="button" data-logout>Sign out</button></div>
  </section>
  <div class="account-layout">
    <nav class="side-tabs" aria-label="Account sections">
      <button class="side-tab is-active" type="button" data-tab="orders">Orders</button>
      <button class="side-tab" type="button" data-tab="saved">Saved totes</button>
      <button class="side-tab" type="button" data-tab="memories">Saved memories</button>
      <button class="side-tab" type="button" data-tab="addresses">Addresses</button>
      <button class="side-tab" type="button" data-tab="profile">Profile</button>
    </nav>
    <div class="account-panels">
      <section class="tab-panel is-active" data-panel="orders" aria-label="Orders"><div data-orders></div></section>
      <section class="tab-panel" data-panel="saved" aria-label="Saved totes"><div data-saved></div></section>
      <section class="tab-panel" data-panel="memories" aria-label="Saved memories">
        <form class="pad stack memory-form crumpled" data-memory-form novalidate>
          <h2>Save a memory for later</h2>
          <div class="field"><label for="mmTitle">Title</label><input id="mmTitle" name="title" required maxlength="120" placeholder="Goa trip, 2019"></div>
          <div class="field"><label for="mmNote">The memory</label><textarea id="mmNote" name="note" rows="3" maxlength="2000"></textarea></div>
          <button class="btn btn-primary" type="submit">Save memory</button>
        </form>
        <div class="memory-grid" data-memories></div>
      </section>
      <section class="tab-panel" data-panel="addresses" aria-label="Addresses"><div data-addresses></div></section>
      <section class="tab-panel" data-panel="profile" aria-label="Profile">
        <form class="pad stack crumpled" data-profile novalidate>
          <div class="field-pair">
            <div class="field"><label for="pfName">Name</label><input id="pfName" name="name" required></div>
            <div class="field"><label for="pfPhone">Phone</label><input id="pfPhone" name="phone" type="tel"></div>
          </div>
          <div class="field"><label for="pfEmail">Email</label><input id="pfEmail" disabled></div>
          <div class="field"><label for="pfSig">Signature line</label><input id="pfSig" name="pronouns" maxlength="60"></div>
          <div class="field"><label for="pfBio">A line about you</label><textarea id="pfBio" name="bio" rows="3" maxlength="400"></textarea></div>
          <button class="btn btn-primary" type="submit">Save profile</button>
        </form>
      </section>
    </div>
  </div>
</div>
</main>
{{> footer}}
<script type="module" src="/js/pages/account.js"></script>
</body>
</html>
