      <path d="M47 50 H73 L75 77 H45 Z" fill="#F4EEE2"/><rect x="51" y="54" width="18" height="15" fill="#f1e0b8"/><circle cx="64" cy="58" r="3" fill="#C98A2A"/><path d="M51 66 Q56 60 60 63 Q64 59 69 65 V69 H51 Z" fill="#3A4CA6"/>
    </g>
    <path d="M22 50 L60 62 V104 L22 92 Z" fill="#C79A63"/>
    <path d="M60 62 L98 50 V92 L60 104 Z" fill="#B3854F"/>
    <g stroke="#7a5a33" stroke-width="1.3" fill="none"><path d="M41 56 V98"/><path d="M79 56 V98"/></g>
    <path class="a flL" d="M22 50 L60 38 L60 62 Z" fill="#D6AE78"/>
    <path class="a flR" d="M98 50 L60 38 L60 62 Z" fill="#CBA06A"/>
    <path class="a tape" pathLength="1" d="M60 38 L60 62 V104" stroke="#E2C493" stroke-width="5" fill="none" opacity=".9"/>
    <g class="a seal"><circle cx="60" cy="83" r="7" fill="#C1443C" filter="url(#srough)"/><circle cx="60" cy="83" r="4" fill="none" stroke="#8f2d27" stroke-width="1"/></g>
    <g class="a label"><g transform="rotate(-10 90 92)"><rect x="78" y="84" width="22" height="13" rx="1" fill="#FBF8F1"/><path d="M81 89 h14 M81 93 h9" stroke="#4a413a" stroke-width=".9"/></g></g>
  </g>
  <path class="a tw" d="M102 18 l1.2 2.8 2.8 1.2 -2.8 1.2 -1.2 2.8 -1.2 -2.8 -2.8 -1.2 2.8 -1.2 Z" fill="#C98A2A"/><path class="a tw" d="M16 25.4 l0.78 1.8199999999999998 1.8199999999999998 0.78 -1.8199999999999998 0.78 -0.78 1.8199999999999998 -0.78 -1.8199999999999998 -1.8199999999999998 -0.78 1.8199999999999998 -0.78 Z" fill="#de8a83"/></g></svg>
