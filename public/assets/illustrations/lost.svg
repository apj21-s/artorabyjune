  </g>
  <g class="spin"><g stroke="#C98A2A" stroke-width="3" stroke-linecap="round"><line class="ray" style="animation-delay:1.65s" pathLength="1" x1="180" y1="63" x2="180" y2="55"/><line class="ray" style="animation-delay:1.69s" pathLength="1" x1="199.4" y1="69.3" x2="204.1" y2="62.8"/><line class="ray" style="animation-delay:1.73s" pathLength="1" x1="211.4" y1="85.8" x2="219" y2="83.3"/><line class="ray" style="animation-delay:1.77s" pathLength="1" x1="211.4" y1="106.2" x2="219" y2="108.7"/><line class="ray" style="animation-delay:1.81s" pathLength="1" x1="199.4" y1="122.7" x2="204.1" y2="129.2"/><line class="ray" style="animation-delay:1.85s" pathLength="1" x1="180" y1="129" x2="180" y2="137"/><line class="ray" style="animation-delay:1.89s" pathLength="1" x1="160.6" y1="122.7" x2="155.9" y2="129.2"/><line class="ray" style="animation-delay:1.93s" pathLength="1" x1="148.6" y1="106.2" x2="141" y2="108.7"/><line class="ray" style="animation-delay:1.97s" pathLength="1" x1="148.6" y1="85.8" x2="141" y2="83.3"/><line class="ray" style="animation-delay:2.01s" pathLength="1" x1="160.6" y1="69.3" x2="155.9" y2="62.8"/></g></g>
  <path class="drip" pathLength="1" d="M254 138 V150" stroke="#C1443C" stroke-width="5" stroke-linecap="round"/>
  <ellipse class="drop o" cx="254" cy="154" rx="3" ry="4" fill="#C1443C"/>
  <g transform="translate(62 214) rotate(-72)"><rect x="-10" y="-13" width="20" height="24" rx="3" fill="#E9E2D3" stroke="#cfc4b2" stroke-width="1"/><rect x="-11" y="-16" width="22" height="5" rx="1.5" fill="#bfb6a6"/><rect x="-10" y="-4" width="20" height="9" fill="#C1443C" opacity=".9"/></g>
  <path class="spill o" d="M76 226 Q86 218 100 222 Q112 224 108 231 Q96 236 80 233 Q70 231 76 226 Z" fill="#C1443C" filter="url(#lrough)"/>
  <g class="step" style="animation-delay:1.20s" fill="#C1443C" opacity=".85"><ellipse cx="114" cy="227" rx="4.6" ry="2.3"/><ellipse cx="106.6" cy="227" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:1.46s" fill="#C1443C" opacity=".85"><ellipse cx="138" cy="233" rx="4.6" ry="2.3"/><ellipse cx="130.6" cy="233" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:1.72s" fill="#C1443C" opacity=".85"><ellipse cx="162" cy="227" rx="4.6" ry="2.3"/><ellipse cx="154.6" cy="227" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:1.98s" fill="#C1443C" opacity=".85"><ellipse cx="186" cy="233" rx="4.6" ry="2.3"/><ellipse cx="178.6" cy="233" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:2.24s" fill="#C1443C" opacity=".85"><ellipse cx="210" cy="227" rx="4.6" ry="2.3"/><ellipse cx="202.6" cy="227" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:2.50s" fill="#C1443C" opacity=".85"><ellipse cx="234" cy="233" rx="4.6" ry="2.3"/><ellipse cx="226.6" cy="233" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:2.76s" fill="#C1443C" opacity=".85"><ellipse cx="258" cy="227" rx="4.6" ry="2.3"/><ellipse cx="250.6" cy="227" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:3.02s" fill="#C1443C" opacity=".85"><ellipse cx="282" cy="233" rx="4.6" ry="2.3"/><ellipse cx="274.6" cy="233" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:3.28s" fill="#C1443C" opacity=".85"><ellipse cx="306" cy="227" rx="4.6" ry="2.3"/><ellipse cx="298.6" cy="227" rx="2.2" ry="1.9"/></g><g class="step" style="animation-delay:3.54s" fill="#C1443C" opacity=".85"><ellipse cx="330" cy="233" rx="4.6" ry="2.3"/><ellipse cx="322.6" cy="233" rx="2.2" ry="1.9"/></g>
  <path d="M310 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" fill="#C98A2A"/><path d="M50 70 l1.5 3.6 3.6 1.5 -3.6 1.5 -1.5 3.6 -1.5 -3.6 -3.6 -1.5 3.6 -1.5 Z" fill="#de8a83"/>
