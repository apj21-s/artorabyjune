# One-click deploy on Render: dashboard.render.com → New → Blueprint → pick this repo.
# Render will ask for every value marked `sync: false`. See HANDOVER.md, step 2.
services:
  - type: web
    name: artora-by-june
    runtime: node
    plan: starter          # "free" works for testing but sleeps when idle; use starter for a live shop
    region: singapore      # closest Render region to India
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: INITIAL_ADMIN_EMAILS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_HANDLE
        value: artorabyjune
      - key: PLAUSIBLE_DOMAIN
        sync: false
